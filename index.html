<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Randomizer">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Randomizer</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;padding:24px}.card{width:min(92vw,420px);background:white;border-radius:28px;padding:30px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.12)}h1{margin:0 0 10px;font-size:28px}.odds{color:#666;line-height:1.6}.result{height:190px;display:grid;place-items:center;font-size:120px;font-weight:800}button{width:100%;border:0;border-radius:18px;padding:20px;font-size:22px;font-weight:700;background:#111;color:#fff}button:active{transform:scale(.985)}.note{margin-top:15px;color:#999;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>Weighted Randomizer</h1>
<div class="odds">1 = 70% &nbsp;•&nbsp; 2 = 25% &nbsp;•&nbsp; 3 = 5%</div>
<div id="result" class="result">—</div>
<button id="go">Randomize</button>
<div class="note">Each tap is a new independent draw.</div>
</div>
<script>
document.getElementById('go').onclick=function(){
  const r=Math.random();
  document.getElementById('result').textContent=r<0.70?'1':r<0.95?'2':'3';
};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
